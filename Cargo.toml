[workspace]
resolver = "3"
members = [
    "rust/drolin-core",
    "rust/drolin-runtime",
    "rust/drolin-cli",
    "rust/drolin-init",
]
default-members = [
    "rust/drolin-core",
    "rust/drolin-runtime",
    "rust/drolin-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/fahrulseptiana/drolin"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
