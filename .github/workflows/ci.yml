name: ci

# Releases are cut from tags only: pushing a branch or opening a pull request
# does not start a run, so the expensive kernel and APK builds happen once per
# version.
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  guest:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm flex bison bc libelf-dev libssl-dev \
            xz-utils e2fsprogs python3 gzip
      - name: build kernel and demo guest
        run: |
          make kernel
          make guest
          cargo build --release
      - name: boot the demo guest
        run: |
          TMPDIR=$RUNNER_TEMP ./target/release/drolin run \
            --kernel kernel/dist/linux-um-aarch64 \
            --initramfs images/dist/initramfs.cpio.gz \
            --marker DROLIN_GUEST_OK --timeout 120
      - name: build and boot Ubuntu
        run: |
          ./images/build-ubuntu.sh
          MODE=host ./net/build-passt.sh
          TMPDIR=$RUNNER_TEMP ./target/release/drolin run \
            --kernel kernel/dist/linux-um-aarch64 \
            --rootfs images/dist/ubuntu-26.04.1-arm64.ext4 \
            --init /sbin/init --arg drolin.poweroff=1 \
            --net --passt net/dist/passt-host \
            --marker DROLIN_GUEST_OK --timeout 180
      # images/build-ubuntu.sh writes the ext4 and its gzip; only the gzip is
      # published, and the APK build consumes it as is.
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-rootfs
          path: images/dist/ubuntu-26.04.1-arm64.ext4.gz
          if-no-files-found: error
          retention-days: 7

  android:
    needs: guest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: android-actions/setup-android@v4
      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm flex bison bc libelf-dev libssl-dev \
            xz-utils e2fsprogs python3 gzip
      - name: install NDK
        run: sdkmanager --install "ndk;30.0.16248370" "platforms;android-35" "build-tools;35.0.0"
      - name: build bionic kernel and passt
        run: |
          NDK="$ANDROID_HOME/ndk/30.0.16248370" ./kernel/build-android.sh
          NDK="$ANDROID_HOME/ndk/30.0.16248370" MODE=android ./net/build-passt.sh
          ls -lh kernel/dist/linux-um-aarch64-android kernel/dist/stub_exe-aarch64-android net/dist/passt-android
      - uses: actions/download-artifact@v8
        with:
          name: ubuntu-rootfs
          path: images/dist
      - name: build APK
        run: |
          ANDROID_HOME="$ANDROID_HOME" \
          KERNEL=kernel/dist/linux-um-aarch64-android \
          STUB=kernel/dist/stub_exe-aarch64-android \
          PASST=net/dist/passt-android \
          ROOTFS=images/dist/ubuntu-26.04.1-arm64.ext4.gz \
          ./android/build-apk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: drolin-apk
          path: android/dist/drolin.apk
          if-no-files-found: error
          retention-days: 7

  release:
    # A failing test or a guest that does not boot must not publish a release.
    needs: [rust, guest, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: name the assets and checksum them
        run: |
          set -eu
          mkdir -p out
          mv dist/drolin.apk "out/drolin-${GITHUB_REF_NAME}-arm64-v8a-debug.apk"
          mv dist/ubuntu-26.04.1-arm64.ext4.gz out/
          cd out
          sha256sum ./*.apk ./*.ext4.gz | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) PRE=--prerelease ;;
            *) PRE= ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a tag push replaces the assets instead of failing.
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --title "$TAG" \
              --notes "The APK is a debug build signed with a throwaway key generated during the run, so Android cannot upgrade an install from another tag: uninstall the previous app first. The attached image is the exact Ubuntu arm64 rootfs the APK boots." \
              --generate-notes \
              --verify-tag $PRE
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
